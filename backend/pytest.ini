[pytest]
# Run from the backend/ directory. `pythonpath = .` puts backend/ on sys.path so
# the tests import the application the same way the application imports itself
# (`from utilities import common`), without an installed package or a sys.path
# fixup in every test module.
pythonpath = .
testpaths = tests

# Local virtualenvs sit inside backend/, so a bare `pytest` would otherwise walk
# their site-packages looking for tests.
norecursedirs = .venv venv .git logs data node_modules

addopts = -ra --strict-markers
asyncio_mode = strict
