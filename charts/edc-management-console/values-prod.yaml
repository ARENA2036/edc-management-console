# Default values for edc-management-console — "claude" environment.
# This file mirrors values-emc.yaml but adds the connector-deployment config the
# backend source code consumes at runtime:
#   * helmRepositories        -> registered via `helm repo add <name> <url>`
#   * supportedVersions -> the last three stable tractusx-connector releases
#   * helm_chart_directory    -> local working dir for the connector chart
#   * valuesTemplatePath      -> mounted upstream default values.yaml (ConfigMap)
# This is a YAML-formatted file.

# This is to override the chart name.
name: "edc-management-console"
nameOverride: ""
fullnameOverride: "emc"

backend:
  enabled: true
  name: "emc-backend"
  replicaCount: 1
  image:
    repository: "harbor-hub-shared.arena.3ascloud.de/arena2036/emc-backend"
    pullPolicy: Always
    tag: "latest"
  envFrom:
    - secretRef:
        name: registry-creds

  # ---------------------------------------------------------------------------
  # Connector deployment settings (chart-level toggles for the template/mount).
  # The runtime values consumed by the backend source live in the embedded
  # `configuration.yml` below under the `connector:` block — keep them in sync.
  # ---------------------------------------------------------------------------
  connector:
    # Local working directory of the tractusx-connector Helm chart.
    helmChartDirectory: "./tractusx-connector"
    # Repositories the backend registers with `helm repo add` before resolving
    # the connector chart's subchart dependencies (vault, postgresql, dtr, ...).
    helmRepositories:
      - name: tractusx
        url: https://eclipse-tractusx.github.io/charts/dev
      - name: hashicorp
        url: https://helm.releases.hashicorp.com
      - name: bitnami
        url: https://charts.bitnami.com/bitnami
    # One ConfigMap per version, each holding that version's upstream default
    # values.yaml (schema differs between versions, e.g. log4j2 added in 0.11).
    # Each is mounted under templates.mountDir as values-<version>.yaml and
    # surfaced to the source via supportedVersions[].valuesTemplate.
    templates:
      enabled: true
      mountDir: /backend/config/connector-templates
      # Must match the files/tractusx-connector-values-<version>.yaml assets
      # and the supportedVersions list in the backend configuration.
      versions:
        - "0.12.1"
        - "0.11.2"
        - "0.10.3"

  # Registry (digital-twin-registry) deployment settings — same template/mount
  # logic as `connector` above: one ConfigMap per version holds that version's
  # upstream values.yaml, mounted under templates.mountDir as values-<version>.yaml.
  registry:
    templates:
      enabled: true
      mountDir: /backend/config/registry-templates
      # Must match the registry-templates/dtr-values-<version>.yaml assets
      # and the digitalTwinRegistry.versions list in the backend configuration.
      versions:
        - "0.12.0"
        - "0.11.0"

  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-passthrough: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: &hostname "emc-backend.prod.arena2036-x.de"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: emc-backend-tls
        hosts:
          - *hostname

  imagePullSecrets:
    - name: registry-creds
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 8001

  configuration:
    yml: |-
      appConfig:
        name: "ARENA2036 EDC Management Console"
        client_id: "A36-EMC"
        version: "1.0.0"
        port: 5000
        host: "0.0.0.0"

        authorization:
          enabled: true
          apiKey:
            key: "X-Api-Key"
            value: "emc-api-key"

        startup:
          checks: true
          refresh_interval: 10

      dataspaceConfig:
        name: "ARENA2036-X"
        authority_id: "BPNL00000003CRHK"
        centralidp:
          url: "https://centralidp.prod.arena2036-x.de/auth/"
          realm: "CX-Central"
          client_id: "${CENTRALIDP_CLIENT_ID}"
          client_secret: "${CENTRALIDP_CLIENT_SECRET}"
        ssi_wallet:
          url: "https://ssi-dim-wallet-stub.prod.arena2036-x.de"
          client_id: "${SSI_WALLET_CLIENT_ID}"
          client_secret: "${SSI_WALLET_CLIENT_SECRET}"
        portal:
          url: "https://portal.prod.arena2036-x.de"
          client_id: "${PORTAL_CLIENT_ID}"
          client_secret: "${PORTAL_CLIENT_SECRET}"
        discovery:
          semantics:
            url: "https://semantics.prod.arena2036-x.de"
          discoveryFinder:
            endpoint: "/discoveryfinder/api/v1.0/administration/connectors/discovery/search"
            keys:
              edc_discovery: "bpn"
            client_id: "${DISCOVERY_FINDER_CLIENT_ID}"
            client_secret: "${DISCOVERY_FINDER_CLIENT_SECRET}"
          bpnDiscovery:
            endpoint: "/bpndiscovery/api/v1.0/administration/connectors/bpnDiscovery/search"
            client_id: "${BPN_DISCOVERY_CLIENT_ID}"
            client_secret: "${BPN_DISCOVERY_CLIENT_SECRET}"
        clusterConfig:
          context: "k8s-ap6-01"
          namespace: "edc-management-console"

      externalApps:
        sde:
          url: https://sde.prod.arena2036-x.de
          client_id: "CX-SDE"
          manufacturerId: BPNLA360COMPANY1
          providerEDC:  https://dataprovider-edc-controlplane.prod.arena2036-x.de
          consumerEDC: https://dataconsumer-controlplane.prod.arena2036-x.de
          registryUrl: https://dtr.prod.arena2036-x.de/semantics/registry

      # Dataspace/EDC query config + the inputs to the deployment derivation context
      # (wallet/sts/bdrs/hostname). Helm repos here are registered at startup so any
      # component's chart + subchart dependencies can be resolved.
      connector:
        default_url: "https://dataconsumer-controlplane.prod.arena2036-x.de"
        # DID method used to derive connector and issuer identities (did:<method>:<host>:<id>).
        didMethod: "did:web"
        helmRepositories:
          - name: tractusx-dev
            url: https://eclipse-tractusx.github.io/charts/dev
          - name: hashicorp
            url: https://helm.releases.hashicorp.com
          - name: bitnami
            url: https://charts.bitnami.com/bitnami
        endpoints:
          assets: "/v3/assets"
          policies: "/v3/policydefinitions"
          contracts: "/v3/contractdefinitions"
          readiness: "/api/check/readiness"
          liveness: "/api/check/liveness"
          catalog: "/management/v3/catalog/request"
          edr_prefix: "/management/v3/edrs"
          view_edr: "/request"
          transfer_edr: "/dataaddress?auto_refresh=true"
          dsp: "/api/v1/dsp"
        hostname:
          controlplane: controlplane.prod.arena2036-x.de
          dataplane: dataplane.prod.arena2036-x.de
        # STS/OAuth paths appended to the SSI wallet url + the vault secret alias.
        sts:
          dimEndpoint: "/api/sts"
          oauthTokenEndpoint: "/oauth/token"
          secretAlias: "edc-wallet-secret"
        # BPN Directory Service (BDRS) path appended to the SSI wallet url.
        bdrs:
          directoryEndpoint: "/api/v1/directory"

      # Generic, component-agnostic deployment definitions. Each component describes
      # its chart, supported versions (base values templates), `derive` rules (computed
      # attributes) and `valueMappings`. Adding a new component is a config change only.
      #
      # valueMappings entry:
      #   path:      dotted target in the values, supports list indices e.g. a.b[0].c
      #   from:      read the value from a source field, OR
      #   value:     use this literal, OR
      #   template:  render this string with {name} (and any source field)
      #   transform: optional, e.g. "urlencode"
      #   mode:      "set" (default) or "append" (for list-valued leaves)
      #   when:      optional flag gate, e.g. "registry" / "submodel"
      components:
        # The EDC connector itself. Deployed when present in the request's `components`
        # array (with type+name). Each field below reads from THAT component's object.
        connector:
          releaseName: "{name}"         # the component's own name
          version: "{version}"          # the component's own version, validated against `versions`
          chart:
            name: tractusx-connector
            repo: tractusx-dev    # name resolved against connector.helmRepositories
          templatesDir: config/connector-templates
          versions:
            - version: "0.12.1"
              valuesYaml: /values-0.12.1.yaml
            - version: "0.11.2"
              valuesYaml: /values-0.11.2.yaml
            # - version: "0.10.3"
            #   valuesYaml: /values-0.10.3.yaml
          # Computed attributes (templated against request fields + dataspace context),
          # set on the request and referenced below via `from`.
          derive:
            iatp_id: "{did_method}:{wallet_host}:{bpn}"
            trustedIssuers: "{did_method}:{wallet_host}:{authority_id}"
            sts_dim_url: "{wallet_url}{sts_dim_endpoint}"
            sts_oauth_tokenUrl: "{wallet_url}{sts_oauth_token_endpoint}"
            sts_oauth_client_id: "{bpn}"
            sts_oauth_secretAlias: "{sts_secret_alias}"
            cp_bdrs_server_url: "{wallet_url}{bdrs_endpoint}"
            cp_hostname: "{name}-{controlplane_hostname}"
            dp_hostname: "{name}-{dataplane_hostname}"
            # Per-plane ingress annotations — each points external-dns at that plane's
            # OWN host. Authored as maps (the shape Helm ingress annotations expect),
            # with templated values resolved against the derivation context.
            controlplane_annotations:
              external-dns.alpha.kubernetes.io/hostname: "{name}-{controlplane_hostname}"
            dataplane_annotations:
              external-dns.alpha.kubernetes.io/hostname: "{name}-{dataplane_hostname}"
            # Image pull secrets — the tractusx-connector chart uses ONE top-level
            # `imagePullSecrets` for both the control plane and data plane (it has no
            # per-plane override), so this single list applies to both.
            imagePullSecrets:
              - name: registry-creds

          valueMappings:
            - path: participant.id
              from: bpn
              transform: urlencode
            - path: iatp.id
              from: iatp_id
            - path: iatp.trustedIssuers
              from: trustedIssuers
              mode: append
            - path: iatp.sts.dim.url
              from: sts_dim_url
            - path: iatp.sts.oauth.token_url
              from: sts_oauth_tokenUrl
            - path: iatp.sts.oauth.client.id
              from: sts_oauth_client_id
            - path: iatp.sts.oauth.client.secret_alias
              from: sts_oauth_secretAlias
            - path: imagePullSecrets
              from: imagePullSecrets
            - path: controlplane.bdrs.server.url
              from: cp_bdrs_server_url
            - path: controlplane.ingresses[0].enabled
              value: true
            - path: controlplane.ingresses[0].endpoints[0]
              value: 'protocol'
            - path: controlplane.ingresses[0].endpoints[1]
              value: 'management'
            - path: controlplane.ingresses[0].hostname
              from: cp_hostname
            - path: controlplane.ingresses[0].certManager.clusterIssuer
              value: 'letsencrypt-int'
            - path: controlplane.ingresses[0].className
              value: 'nginx'
            - path: controlplane.ingresses[0].annotations
              from: controlplane_annotations
            - path: controlplane.ingresses[0].tls.enabled
              value: false
            - path: controlplane.ingresses[0].tls.secretName
              template: "{name}-cp-tls"
            - path: dataplane.ingresses[0].enabled
              value: false
            - path: dataplane.ingresses[0].hostname
              from: dp_hostname
            - path: dataplane.ingresses[0].certManager.clusterIssuer
              value: 'letsencrypt-int'
            - path: dataplane.ingresses[0].className
              value: 'nginx'
            - path: dataplane.ingresses[0].annotations
              from: dataplane_annotations
            - path: dataplane.ingresses[0].tls.enabled
              value: false
            - path: dataplane.ingresses[0].tls.secretName
              template: "{name}-dp-tls"
            - path: dataplane.token.signer.privatekey_alias
              value: "tokenSignerPrivateKey"
            - path: dataplane.token.verifier.publickey_alias
              value: "tokenSignerPublicKey"
            # The chart's jdbcUrl hardcodes "/edc"; override it so the control plane
            # connects to the SAME database Bitnami creates from auth.database below.
            # {name}-postgresql == "{{ .Release.Name }}-postgresql" (releaseName is {name}).
            - path: postgresql.jdbcUrl
              template: "jdbc:postgresql://{name}-postgresql:5432/{db_name}"
            - path: postgresql.auth.database
              from: db_name
            - path: postgresql.auth.username
              from: auth.db_username
            - path: postgresql.auth.password
              from: auth.db_password

        # Submodel Server — its own chart + release. Deployed when present in the
        # request's `components` array. `url` is its ingress host; `auth.*` its DB creds.
        submodelServer:
          releaseName: "{name}"             # the component's own name
          version: "{version}"              # the component's own version
          healthPath: "/actuator/health/liveness"                   # reachability probe path appended to the ingress url
          chart:
            # This config would be used for local deployment without Docker
            # name: simple-data-backend
            # repo: tractusx-dev

            # Deploy from the LOCAL chart copy in config/ (patched with probe enable
            # toggles) instead of pulling simple-data-backend from the repo. Having path issues on windows, 
            # but should be working inside container
            directory: config/simple-data-backend
          # Base values come from config/submodelserver-templates (NOT the chart default).
          templatesDir: config/submodelserver-templates
          versions:
            - version: "0.1.0"
              valuesYaml: /values-0.1.0.yaml
          derive:
            # simple-data-backend has NO certManager field — TLS is issued via the
            # cert-manager annotation. external-dns points at this component's own host.
            annotations:
              external-dns.alpha.kubernetes.io/hostname: "{url}"
              #cert-manager.io/cluster-issuer: "letsencrypt-int"
          valueMappings:
            - path: fullnameOverride
              template: "{name}"
            - path: ingress.enabled           # chart default is false
              value: true
            - path: ingress.className
              value: ''
            - path: ingress.annotations
              from: annotations
            - path: ingress.hosts[0].host
              from: url
            - path: ingress.hosts[0].paths[0].path
              value: '/'
            - path: ingress.hosts[0].paths[0].pathType
              value: 'Prefix'
            - path: ingress.tls[0].hosts[0]
              from: url
            - path: ingress.tls[0].secretName
              template: "{name}-submodel-tls"
            # Liveness/readiness probes — the local chart gates them on `.enabled`.
            # The image's /actuator/health/* paths 404, so keep them off here.
            - path: livenessProbe.enabled
              value: false
            - path: readinessProbe.enabled
              value: false

        # Digital Twin Registry — its own chart + release. Deployed when present in the
        # request's `components` array. `url` is its ingress host; `auth.*` its DB creds.
        digitalTwinRegistry:
          releaseName: "{name}"             # the component's own name
          version: "{version}"             # the component's own version
          healthPath: "/semantics/registry/"   # reachability probe path appended to the ingress url
          chart:
            name: digital-twin-registry
            repo: tractusx-dev
          # Base values per version come from the mounted registry-templates
          # ConfigMaps (backend.registry.templates), like connector-templates.
          templatesDir: config/registry-templates
          # Last 2 stable releases (latest first). Source: tractusx charts/dev index.
          versions:
            - version: "0.12.0"
              valuesYaml: /values-0.12.0.yaml
            - version: "0.11.0"
              valuesYaml: /values-0.11.0.yaml
          derive:
            # digital-twin-registry issues TLS via the cert-manager annotation (no
            # certManager field). external-dns points at this component's own host.
            annotations:
              external-dns.alpha.kubernetes.io/hostname: "{url}"
              #cert-manager.io/cluster-issuer: "letsencrypt-int"
              nginx.ingress.kubernetes.io/rewrite-target: /$2
              nginx.ingress.kubernetes.io/use-regex: "true"
              nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
              nginx.ingress.kubernetes.io/x-forwarded-prefix: /semantics/registry
          valueMappings:
            - path: fullnameOverride          # top-level (the chart has no registry.fullnameOverride)
              template: "{name}"
            - path: enableKeycloak
              value: false
            # The chart ALWAYS renders templates/keycloak/init-script-configmap.yaml as
            # "{keycloak.fullnameOverride}-configmap" (not gated on enableKeycloak). The
            # chart default fullnameOverride is the fixed "registry-keycloak", so two DTR
            # releases in one namespace collide on "registry-keycloak-configmap". Make it
            # release-unique so each DTR owns its own configmap.
            - path: keycloak.fullnameOverride
              template: "{name}-keycloak"
            # Bundled postgres (like the connector). With enablePostgres=true the chart
            # deploys its own DB and wires the registry to it via postgres-init, so the
            # registry-secret's external `dataSource` block is skipped entirely.
            - path: enablePostgres
              value: true
            - path: postgresql.auth.username
              from: auth.db_username          # from the component's auth block
            - path: postgresql.auth.password
              from: auth.db_password          # empty -> chart generates a random one
            - path: postgresql.auth.database
              from: db_name
            # The init secret name (chart default "secret-dtr-postgres-init") is shared
            # by the postgres-init hook, the registry deployment and the postgres
            # subchart. It's a fixed literal, so two DTR releases collide on it — make
            # it release-unique (all three consumers read this same value).
            - path: postgresql.auth.existingSecret
              template: "{name}-postgres-init"
            - path: registry.host             # the externally-resolvable ingress host
              from: url
            - path: registry.ingress.enabled
              value: true
            - path: registry.ingress.urlPrefix
              value: '/semantics/registry'
            - path: registry.ingress.className
              value: 'nginx'
            - path: registry.ingress.annotations
              from: annotations
            - path: registry.ingress.tls.enabled        # tls is a MAP here, not a list
              value: true
            - path: registry.ingress.tls.secretName
              template: "{name}-dtr-tls"

        # IdentityHub — its own chart + release, deployed for every connector
        # (it is the connector's own DID/credential service, not an optional add-on).
        # identityhub:
        #   deployWhen: always
        #   releaseName: "{name}-idhub"
        #   chart:
        #     name: tractusx-identityhub
        #     repo: tractusx-dev
        #   # Last 3 stable releases (latest first; note the chart tags carry a 'v').
        #   # Source: tractusx charts/dev index.
        #   versions:
        #     - version: "v0.3.2"
        #     - version: "v0.3.1"
        #     - version: "v0.3.0"
        #   valueMappings:
        #     - path: fullnameOverride
        #       template: "{name}-idhub"
        #     - path: ingress.hosts[0].host
        #       template: "{name}.int.construct-x.net"
        #     - path: ingress.tls[0].hosts[0]
        #       template: "{name}.int.construct-x.net"
        #     - path: ingress.tls[0].secretName
        #       template: "{name}-idhub-tls"

      database:
        url: "${DATABASE_URL}"
        echo: false

  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  podSecurityContext: {}
  securityContext: {}

  envFrom: []
  env:
    - name: CLUSTER_SECRET
      value: "cluster-prod"
    - name: VAULT_ADDR
      value: "https://vault.staging.arena2036-x.de"
    - name: VAULT_TOKEN
      valueFrom:
        secretKeyRef:
          name: vault-token
          key: token

  ## Additional volumes on the output Deployment definition.
  volumes:
    # -- persist the backend configuration
    - name: emc-backend-config
      configMap:
        name: "{{ .Release.Name }}-backend-config"
    # -- per-version upstream tractusx-connector default values.yaml (render templates)
    - name: connector-tpl-0-12-1
      configMap:
        name: "{{ .Release.Name }}-tractusx-connector-values-0-12-1"
    - name: connector-tpl-0-11-2
      configMap:
        name: "{{ .Release.Name }}-tractusx-connector-values-0-11-2"
    - name: connector-tpl-0-10-3
      configMap:
        name: "{{ .Release.Name }}-tractusx-connector-values-0-10-3"
    - name: dtr-tpl-0-11-0
      configMap:
        name: "{{ .Release.Name }}-dtr-values-0-11-0"
    - name: dtr-tpl-0-12-0
      configMap:
        name: "{{ .Release.Name }}-dtr-values-0-12-0"
    # -- persist the backend data directories
    - name: pvc-emc-backend
      persistentVolumeClaim:
        claimName: "{{ .Release.Name }}-pvc-emc-backend-data"
    # -- temporary file system mount
    - name: tmpfs
      emptyDir: {}

  ## Volume mounts for the backend deployment.
  volumeMounts:
    # -- mounted path for the backend configuration added in the config maps
    - name: emc-backend-config
      mountPath: /backend/config/configuration.yml
      subPath: configuration.yml
    # -- mounted per-version upstream connector value templates.
    # subPath is the ConfigMap data KEY (always "values.yaml"); the version is
    # carried by mountPath. Using "values-<version>.yaml" here would not match any
    # key, so kubelet mounts an empty dir -> "not a directory" container init error.
    - name: connector-tpl-0-12-1
      mountPath: /backend/config/connector-templates/values-0.12.1.yaml
      subPath: values.yaml
    - name: connector-tpl-0-11-2
      mountPath: /backend/config/connector-templates/values-0.11.2.yaml
      subPath: values.yaml
    - name: connector-tpl-0-10-3
      mountPath: /backend/config/connector-templates/values-0.10.3.yaml
      subPath: values.yaml
    - name: dtr-tpl-0-11-0
      mountPath: /backend/config/registry-templates/values-0.11.0.yaml
      subPath: values.yaml
    - name: dtr-tpl-0-12-0
      mountPath: /backend/config/registry-templates/values-0.12.0.yaml
      subPath: values.yaml
    # -- contains the location for the process data directory
    - name: pvc-emc-backend
      mountPath: /backend/data
      subPath: data
    # -- contains the log directory used by the backend
    - name: tmpfs
      mountPath: /backend/logs
      subPath: logs

frontend:
  enabled: true
  name: "emc-frontend"
  replicaCount: 1
  image:
    repository: "harbor-hub-shared.arena.3ascloud.de/arena2036/emc-frontend"
    pullPolicy: Always
    tag: "latest"
  imagePullSecrets:
    - name: registry-creds

  env:
    - name: VITE_BACKEND_URL
      value: https://emc-backend.prod.arena2036-x.de
    - name: VITE_API_KEY
      value: emc-api-key
    - name: VITE_EDC_HOSTNAME
      value: prod.arena2036-x.de
    - name: VITE_KEYCLOAK_URL
      value: https://centralidp.prod.arena2036-x.de/auth/
    - name: VITE_KEYCLOAK_REALM
      value: "CX-Central"
    - name: VITE_KEYCLOAK_CLIENT_ID
      value: A36-EMC
    - name: VITE_SDE_URL
      value: https://sde.prod.arena2036-x.de
    - name: VITE_PORTAL_URL
      value: https://portal.prod.arena2036-x.de

  configuration: |-
    window.__RUNTIME_CONFIG__ = {
    apiUrl: https://emc-backend.prod.arena2036-x.de,
    apiKey: emc-api-key,
    edcHost: arena2036-x.de,
    keycloakUrl: https://centralidp.prod.arena2036-x.de/auth,
    realm: CX-Central,
    clientId: A36-EMC,
    sdeUrl: https://sde.prod.arena2036-x.de,
    portalUrl: https://portal.prod.arena2036-x.de
    };

  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-passthrough: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/service-upstream: "true"
    hosts:
      - host: &fehostname "emc.prod.arena2036-x.de"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: emc-frontend-tls
        hosts:
          - *fehostname

  resources: {}
  volumes:
    - name: emc-frontend-config
      configMap:
        name: "{{ .Release.Name }}-frontend-config"
  volumeMounts:
    - name: emc-frontend-config
      mountPath: /frontend/.env
      subPath: .env
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

livenessProbe:
  httpGet:
    path: /health
    port: 8001
readinessProbe:
  httpGet:
    path: /health
    port: 8001

nodeSelector: {}
tolerations: []
affinity: {}

# By default we're disabling observability
grafana:
  enabled: true

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - grafana.prod.arena2036-x.de
    path: /
    pathType: Prefix
    tls:
      - secretName: emc-grafana-prod-tls
        hosts:
          - grafana.prod.arena2036-x.de

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: edc-management-console

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://emc-prometheus-server
          isDefault: true
          editable: false

        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://emc-loki-gateway
          editable: false

# Prometheus
prometheus:
  enabled: true
  # Not required for a small prod environment.
  alertmanager:
    enabled: false
  # Keep this enabled because your dashboard uses kube_* metrics.
  kube-state-metrics:
    enabled: true
  # Creates one pod on every Kubernetes node when enabled.
  prometheus-node-exporter:
    enabled: false
  # Not required unless applications explicitly push metrics.
  prometheus-pushgateway:
    enabled: false

  server:
    persistentVolume:
      enabled: true
      size: 10Gi

# Loki
loki:
  enabled: true
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
      path_prefix: /var/loki
    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin

    useTestSchema: true

    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 168h

    compactor:
      retention_enabled: true
      delete_request_store: filesystem

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""

  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0

  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  gateway:
    enabled: true

  lokiCanary:
    enabled: false

  # Required when lokiCanary is disabled.
  test:
    enabled: false

# Disabled components
opentelemetry-collector:
  enabled: false
jaeger:
  enabled: false