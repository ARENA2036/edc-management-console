---
# Default values for edc-management-console.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
name: "edc-management-console"
nameOverride: ""
fullnameOverride: ""

backend:
  enabled: true
  name: "emc-backend"
  # Per-version chart-template ConfigMaps for the connector/registry component
  # wizard (see templates/connector-values-configmap.yaml and
  # registry-values-configmap.yaml). Off by default in this generic values
  # file - environments that deploy these components enable them with their
  # own mountDir/versions (see values-dev.yaml for a populated example).
  connector:
    templates:
      enabled: false
  registry:
    templates:
      enabled: false
  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1
  strategy:
    type: Recreate
  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    # repository: nginx
    repository: "registry.example.com/emc-backend"
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  envFrom:
    - secretRef:
        name: emc-azure-credentials
  ingress:
    enabled: true
    ingressClassName: "webapprouting.kubernetes.azure.com"
    # className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # kubernetes.io/tls-acme: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-passthrough: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: &hostname "emc-backend.example.com"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: default-ssl-certificate
        hosts:
          - *hostname

  # -- Existing image pull secret to use to [obtain the container image from private registries](https://kubernetes.io/docs/concepts/containers/images/#using-a-private-registry)
  imagePullSecrets:
    - name: acr-pull-secret
  # Rendered into /backend/config/configuration.yml (see templates/configmap-backend.yaml).
  # Every value here is read defensively (app/core/config.py: `.get(...) or {}`
  # throughout), so a minimal/empty config is safe at startup - it just means no
  # dataspace identity, connector or deployable components are configured yet.
  # Environments provide their real dataspace config (see values-dev.yaml).
  configuration:
    yml: |-
      appConfig:
        name: "EDC Management Console"
        client_id: "EMC"
      dataspaceConfig:
        name: "Dataspace"
        authority_id: "BPNL000000000000"
  podAnnotations: {}
    # This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
  service:
    # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
    type: ClusterIP
    # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
    # The backend image serves on 8001 (backend/Dockerfile).
    port: 8001

  authorization:
    enabled: true
    apiKey:
      key: "X-Api-Key"
      value: ifs-api-key

  flags:
    - industry: chemicals

    - industry: automotive
      mimetype: application/json
      proof: >
        {
          "result": true
        }

  startup:
    checks: False
    refresh_interval: 10

  ifs:
    ## Refresh interval for the cache of applications
    refresh_interval: 1440
    ## DCT Type used to find the applications in the cache
    dct_type: "IndustryFlagService"
    ## JSON array of policies that are allowed to be used
    policies: >
      [
        {
          "odrl:permission": {
              "odrl:action": {
                  "@id": "odrl:use"
              },
              "odrl:constraint": {
                "odrl:leftOperand": {
                    "@id": "cx-policy:UsagePurpose"
                },
                "odrl:operator": {
                    "@id": "odrl:eq"
                },
                "odrl:rightOperand": "catenax.industryflagservice"
            }
          },
          "odrl:prohibition": [],
          "odrl:obligation": []
        }
      ]

  edc:
    url: "https://control.plane.url"
    apis:
      readiness: "/api/check/readiness"
      catalog: "/management/v3/catalog/request"
      edr_prefix: "/management/v2/edrs"
      view_edr: "/request"
      transfer_edr: "/dataaddress?auto_refresh=true"
      dsp: "/api/v1/dsp"

    oauth:
      apiKey: ""

    participantId: ""

    dct_type_key: "'http://purl.org/dc/terms/type'.'@id'"

    cache:
      expiration_time: 60

  discovery:
    url: "https://TODO__XXX__YOUR_VALUE___XXX.cofinity-x.com/api/v1.0/administration/connectors/discovery/search"
    keys:
      edc_discovery: "bpnl"

  catenax:
    centralidp:
      url: "https://TODO__XXX__YOUR_VALUE___XXX.cofinity-x.com/auth/"
      realm: CX-Central
      clientid: "TODO__XXX__YOUR_VALUE___XXX"
      clientsecret: "TODO__XXX__YOUR_VALUE___XXX"

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
  #   cpu: 100m
  #   memory: 128Mi
  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 3000
    fsGroup: 3000
  securityContext: {}
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

  persistence:
    enabled: true
    storageClass: ""
    size: 1Gi
    accessModes:
      - ReadWriteOnce

  ## Additional volumes on the output Deployment definition.
  volumes:
    # -- persist the backend configuration
    - name: emc-backend-config
      configMap:
        name: "{{ .Release.Name }}-backend-config"
    # -- persist the backend data directories
    - name: pvc-emc-backend
      persistentVolumeClaim:
        claimName: "{{ .Release.Name }}-pvc-emc-backend-data"
    # -- temporary file system mount
    - name: tmpfs
      emptyDir: {}
    #  - name: secrets-store
    #    csi:
    #      driver: secrets-store.csi.k8s.io
    #      readOnly: true
    #      volumeAttributes:
    #        secretProviderClass: "secrets-provider

    # -- specifies the volume mounts for the backend deployment
  volumeMounts:
    - name: emc-backend-config
      mountPath: /backend/config/configuration.yml
      subPath: configuration.yml
    # -- contains the location for the process data directory
    - name: pvc-emc-backend
      mountPath: /backend/data
      subPath: data
    # -- contains the log directory uses by the backend
    - name: tmpfs
      mountPath: /backend/logs
      subPath: logs

frontend:
  enabled: true
  name: "emc-frontend"
  # Rendered into the frontend ConfigMap's config.js key (templates/configmap-frontend.yaml).
  # Environments override this with their real runtime values (see values-dev.yaml).
  configuration: |-
    window.__RUNTIME_CONFIG__ = {};
  # This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
  replicaCount: 1
  # This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
  image:
    # repository: nginx
    repository: "registry.example.com/emc-frontend"
    # This sets the pull policy for images.
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: "latest"
  imagePullSecrets:
    - name: acr-pull-secret

  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    ingressClassName: "webapprouting.kubernetes.azure.com"
    # className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # kubernetes.io/tls-acme: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-passthrough: "false"
      # nginx.ingress.kubernetes.io/rewrite-target: "/$2"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/service-upstream: "true"
    hosts:
      - host: &hostname "emc-frontend.example.com"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: default-ssl-certificate
        hosts:
          - *hostname

  resources: {}
    # We usually recommend not to specify default resources and to leave this as a conscious
    # choice for the user. This also increases chances charts run on environments with little
    # resources, such as Minikube. If you do want to specify resources, uncomment the following
    # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
  #   cpu: 100m
  #   memory: 128Mi
  volumeMounts: []

  # This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80


# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000


# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  timeoutSeconds: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  timeoutSeconds: 3


nodeSelector: {}

tolerations: []

affinity: {}

# Optional observability stack (Chart.yaml `dependencies`, each gated by its
# own `condition`). Helm enables a dependency whenever its condition path is
# unresolvable, so leaving these unset here does not mean "off" - it means
# every one of them renders with this chart's bare defaults, and several
# (loki in particular) fail outright without real storage/backend config they
# have no sensible default for. Off here; environments that want them enable
# and configure each one explicitly (see values-dev.yaml).
prometheus:
  enabled: false

loki:
  enabled: false

grafana:
  enabled: false

jaeger:
  enabled: false

opentelemetry-collector:
  enabled: false
