# Default values for edc-management-console — "claude" environment.
# This file mirrors values-emc.yaml but adds the connector-deployment config the
# backend source code consumes at runtime:
#   * helmRepositories        -> registered via `helm repo add <name> <url>`
#   * supportedVersions -> the last three stable tractusx-connector releases
#   * helm_chart_directory    -> local working dir for the connector chart
#   * valuesTemplatePath      -> mounted upstream default values.yaml (ConfigMap)
# This is a YAML-formatted file.

# This is to override the chart name.
name: "edc-management-console"
nameOverride: ""
fullnameOverride: "emc"
backend:
  enabled: true
  name: "emc-backend"
  replicaCount: 1
  image:
    repository: "harbor-hub-shared.arena.3ascloud.de/arena2036/emc-backend"
    pullPolicy: Always
    tag: "8505ebe061e96a4c07c5b2dde073f76bd7f2f0a0"
  envFrom:
    - secretRef:
        name: registry-creds
  # ---------------------------------------------------------------------------
  # Connector deployment settings (chart-level toggles for the template/mount).
  # The runtime values consumed by the backend source live in the embedded
  # `configuration.yml` below under the `connector:` block — keep them in sync.
  # ---------------------------------------------------------------------------
  connector:
    # Local working directory of the tractusx-connector Helm chart.
    helmChartDirectory: "./tractusx-connector"
    # Repositories the backend registers with `helm repo add` before resolving
    # the connector chart's subchart dependencies (vault, postgresql, dtr, ...).
    helmRepositories:
      - name: tractusx
        url: https://eclipse-tractusx.github.io/charts/dev
      - name: hashicorp
        url: https://helm.releases.hashicorp.com
      - name: bitnami
        url: https://charts.bitnami.com/bitnami
    # One ConfigMap per version, each holding that version's upstream default
    # values.yaml (schema differs between versions, e.g. log4j2 added in 0.11).
    # Each is mounted under templates.mountDir as values-<version>.yaml and
    # surfaced to the source via supportedVersions[].valuesTemplate.
    templates:
      enabled: true
      mountDir: /backend/config/connector-templates
      # Must match the files/tractusx-connector-values-<version>.yaml assets
      # and the supportedVersions list in the backend configuration.
      versions:
        - "0.12.1"
        - "0.11.2"
        - "0.10.3"
  # Registry (digital-twin-registry) deployment settings — same template/mount
  # logic as `connector` above: one ConfigMap per version holds that version's
  # upstream values.yaml, mounted under templates.mountDir as values-<version>.yaml.
  registry:
    templates:
      enabled: true
      mountDir: /backend/config/registry-templates
      # Must match the registry-templates/dtr-values-<version>.yaml assets
      # and the digitalTwinRegistry.versions list in the backend configuration.
      versions:
        - "0.12.0"
        - "0.11.0"
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-int
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-passthrough: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: &hostname "emc-backend.txcd.arena2036.app"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: emc-backend-tls
        hosts:
          - *hostname
  imagePullSecrets:
    - name: registry-creds
  podAnnotations: {}
  service:
    type: ClusterIP
    port: 8001
  configuration:
    yml: "appConfig:\n  name: \"ARENA2036 EDC Management Console\"\n  client_id: \"EMC\"\n  version: \"1.0.0\"\n  port: 5000\n  host: \"0.0.0.0\"\n\n  authorization:\n    enabled: true\n    apiKey:\n      key: \"X-Api-Key\"\n      value: \"emc-api-key\"\n\n  startup:\n    checks: true\n    refresh_interval: 10\n\ndataspaceConfig:\n  name: \"ARENA2036-X\"\n  authority_id: \"BPNL00000003CRHK\"\n  centralidp:\n    url: \"https://centralidp.txcd.arena2036-x.de/auth/\"\n    realm: \"CX-Central\"\n    client_id: \"${CENTRALIDP_CLIENT_ID}\"\n    client_secret: \"${CENTRALIDP_CLIENT_SECRET}\"\n  ssi_wallet:\n    url: \"https://ssi-dim-wallet-stub.txcd.arena2036-x.de\"\n    client_id: \"${SSI_WALLET_CLIENT_ID}\"\n    client_secret: \"${SSI_WALLET_CLIENT_SECRET}\"\n  portal:\n    url: \"https://portal.txcd.arena2036-x.de\"\n    client_id: \"${PORTAL_CLIENT_ID}\"\n    client_secret: \"${PORTAL_CLIENT_SECRET}\"\n  discovery:\n    semantics:\n      url: \"https://semantics.txcd.arena2036-x.de\"\n    discoveryFinder:\n      endpoint: \"/discoveryfinder/api/v1.0/administration/connectors/discovery/search\"\n      keys:\n        edc_discovery: \"bpn\"\n      client_id: \"${DISCOVERY_FINDER_CLIENT_ID}\"\n      client_secret: \"${DISCOVERY_FINDER_CLIENT_SECRET}\"\n    bpnDiscovery:\n      endpoint: \"/bpndiscovery/api/v1.0/administration/connectors/bpnDiscovery/search\"\n      client_id: \"${BPN_DISCOVERY_CLIENT_ID}\"\n      client_secret: \"${BPN_DISCOVERY_CLIENT_SECRET}\"\n  clusterConfig:\n    context: \"k8s-ap6-01\"\n    namespace: \"edc-management-console\"\n\n\nexternalApps:\n  sde:\n    url: https://sde.txcd.arena2036.app\n    client_id: \"sde\"\n    manufacturerId: BPNL00000000052O\n    providerEDC:  https://connector-2-controlplane.txcd.arena2036.app\n    consumerEDC: https://connector-2-controlplane.txcd.arena2036.app\n    registryUrl: https://connector-2-dtr.txcd.arena2036.app/semantics/registry\n\n\n# Dataspace/EDC query config + the inputs to the deployment derivation context\n# (wallet/sts/bdrs/hostname). Helm repos here are registered at startup so any\n# component's chart + subchart dependencies can be resolved.\nconnector:\n  default_url: \"https://connector-2-controlplane.txcd.arena2036.app\"\n  # DID method used to derive connector and issuer identities (did:<method>:<host>:<id>).\n  didMethod: \"did:web\"\n  helmRepositories:\n    - name: tractusx-dev\n      url: https://eclipse-tractusx.github.io/charts/dev\n    - name: hashicorp\n      url: https://helm.releases.hashicorp.com\n    - name: bitnami\n      url: https://charts.bitnami.com/bitnami\n  endpoints:\n    assets: \"/v3/assets\"\n    policies: \"/v3/policydefinitions\"\n    contracts: \"/v3/contractdefinitions\"\n    readiness: \"/api/check/readiness\"\n    liveness: \"/api/check/liveness\"\n    catalog: \"/management/v3/catalog/request\"\n    edr_prefix: \"/management/v3/edrs\"\n    view_edr: \"/request\"\n    transfer_edr: \"/dataaddress?auto_refresh=true\"\n    dsp: \"/api/v1/dsp\"\n  hostname:\n    controlplane: controlplane.txcd.arena2036.app\n    dataplane: dataplane.txcd.arena2036.app\n  # STS/OAuth paths appended to the SSI wallet url + the vault secret alias.\n  sts:\n    dimEndpoint: \"/api/sts\"\n    oauthTokenEndpoint: \"/oauth/token\"\n    secretAlias: \"edc-wallet-secret\"\n  # BPN Directory Service (BDRS) path appended to the SSI wallet url.\n  bdrs:\n    directoryEndpoint: \"/api/v1/directory\"\n\n# Generic, component-agnostic deployment definitions. Each component describes\n# its chart, supported versions (base values templates), `derive` rules (computed\n# attributes) and `valueMappings`. Adding a new component is a config change only.\n#\n# valueMappings entry:\n#   path:      dotted target in the values, supports list indices e.g. a.b[0].c\n#   from:      read the value from a source field, OR\n#   value:     use this literal, OR\n#   template:  render this string with {name} (and any source field)\n#   transform: optional, e.g. \"urlencode\"\n#   mode:      \"set\" (default) or \"append\" (for list-valued leaves)\n#   when:      optional flag gate, e.g. \"registry\" / \"submodel\"\ncomponents:\n  # The EDC connector itself. Deployed when present in the request's `components`\n  # array (with type+name). Each field below reads from THAT component's object.\n  connector:\n    releaseName: \"{name}\"         # the component's own name\n    version: \"{version}\"          # the component's own version, validated against `versions`\n    chart:\n      name: tractusx-connector\n      repo: tractusx-dev    # name resolved against connector.helmRepositories\n    templatesDir: config/connector-templates\n    versions:\n      - version: \"0.12.1\"\n        valuesYaml: /values-0.12.1.yaml\n      - version: \"0.11.2\"\n        valuesYaml: /values-0.11.2.yaml\n      # - version: \"0.10.3\"\n      #   valuesYaml: /values-0.10.3.yaml\n    # Computed attributes (templated against request fields + dataspace context),\n    # set on the request and referenced below via `from`.\n    derive:\n      iatp_id: \"{did_method}:{wallet_host}:{bpn}\"\n      trustedIssuers: \"{did_method}:{wallet_host}:{authority_id}\"\n      sts_dim_url: \"{wallet_url}{sts_dim_endpoint}\"\n      sts_oauth_tokenUrl: \"{wallet_url}{sts_oauth_token_endpoint}\"\n      sts_oauth_client_id: \"{bpn}\"\n      sts_oauth_secretAlias: \"{sts_secret_alias}\"\n      cp_bdrs_server_url: \"{wallet_url}{bdrs_endpoint}\"\n      cp_hostname: \"{name}-{controlplane_hostname}\"\n      dp_hostname: \"{name}-{dataplane_hostname}\"\n      # Per-plane ingress annotations — each points external-dns at that plane's\n      # OWN host. Authored as maps (the shape Helm ingress annotations expect),\n      # with templated values resolved against the derivation context.\n      controlplane_annotations:\n        external-dns.alpha.kubernetes.io/hostname: \"{name}-{controlplane_hostname}\"\n      dataplane_annotations:\n        external-dns.alpha.kubernetes.io/hostname: \"{name}-{dataplane_hostname}\"\n      # Image pull secrets — the tractusx-connector chart uses ONE top-level\n      # `imagePullSecrets` for both the control plane and data plane (it has no\n      # per-plane override), so this single list applies to both.\n      imagePullSecrets:\n        - name: registry-creds\n\n    valueMappings:\n      - path: participant.id\n        from: bpn\n        transform: urlencode\n      - path: iatp.id\n        from: iatp_id\n      - path: iatp.trustedIssuers\n        from: trustedIssuers\n        mode: append\n      - path: iatp.sts.dim.url\n        from: sts_dim_url\n      - path: iatp.sts.oauth.token_url\n        from: sts_oauth_tokenUrl\n      - path: iatp.sts.oauth.client.id\n        from: sts_oauth_client_id\n      - path: iatp.sts.oauth.client.secret_alias\n        from: sts_oauth_secretAlias\n      - path: imagePullSecrets\n        from: imagePullSecrets\n      - path: controlplane.bdrs.server.url\n        from: cp_bdrs_server_url\n      - path: controlplane.ingresses[0].enabled\n        value: true\n      - path: controlplane.ingresses[0].endpoints[0]\n        value: 'protocol'\n      - path: controlplane.ingresses[0].endpoints[1]\n        value: 'management'\n      - path: controlplane.ingresses[0].hostname\n        from: cp_hostname\n      - path: controlplane.ingresses[0].certManager.clusterIssuer\n        value: 'letsencrypt-int'\n      - path: controlplane.ingresses[0].className\n        value: 'nginx'\n      - path: controlplane.ingresses[0].annotations\n        from: controlplane_annotations\n      - path: controlplane.ingresses[0].tls.enabled\n        value: true\n      - path: controlplane.ingresses[0].tls.secretName\n        template: \"{name}-cp-tls\"\n      - path: dataplane.ingresses[0].enabled\n        value: true\n      - path: dataplane.ingresses[0].hostname\n        from: dp_hostname\n      - path: dataplane.ingresses[0].certManager.clusterIssuer\n        value: 'letsencrypt-int'\n      - path: dataplane.ingresses[0].className\n        value: 'nginx'\n      - path: dataplane.ingresses[0].annotations\n        from: dataplane_annotations\n      - path: dataplane.ingresses[0].tls.enabled\n        value: true\n      - path: dataplane.ingresses[0].tls.secretName\n        template: \"{name}-dp-tls\"\n      - path: dataplane.token.signer.privatekey_alias\n        value: \"tokenSignerPrivateKey\"\n      - path: dataplane.token.verifier.publickey_alias\n        value: \"tokenSignerPublicKey\"\n      # The chart's jdbcUrl hardcodes \"/edc\"; override it so the control plane\n      # connects to the SAME database Bitnami creates from auth.database below.\n      # {name}-postgresql == \"{{ .Release.Name }}-postgresql\" (releaseName is {name}).\n      - path: postgresql.jdbcUrl\n        template: \"jdbc:postgresql://{name}-postgresql:5432/{db_name}\"\n      - path: postgresql.auth.database\n        from: db_name\n      - path: postgresql.auth.username\n        from: auth.db_username\n      - path: postgresql.auth.password\n        from: auth.db_password\n\n  # Submodel Server — its own chart + release. Deployed when present in the\n  # request's `components` array. `url` is its ingress host; `auth.*` its DB creds.\n  submodelServer:\n    releaseName: \"{name}\"             # the component's own name\n    version: \"{version}\"              # the component's own version\n    healthPath: \"/actuator/health/liveness\"                   # reachability probe path appended to the ingress url\n    chart:\n      # This config would be used for local deployment without Docker\n      # name: simple-data-backend\n      # repo: tractusx-dev\n\n      # Deploy from the LOCAL chart copy in config/ (patched with probe enable\n      # toggles) instead of pulling simple-data-backend from the repo. Having path issues on windows, \n      # but should be working inside container\n      directory: config/simple-data-backend\n    # Base values come from config/submodelserver-templates (NOT the chart default).\n    templatesDir: config/submodelserver-templates\n    versions:\n      - version: \"0.1.0\"\n        valuesYaml: /values-0.1.0.yaml\n    derive:\n      # simple-data-backend has NO certManager field — TLS is issued via the\n      # cert-manager annotation. external-dns points at this component's own host.\n      annotations:\n        external-dns.alpha.kubernetes.io/hostname: \"{url}\"\n        #cert-manager.io/cluster-issuer: \"letsencrypt-int\"\n    valueMappings:\n      - path: fullnameOverride\n        template: \"{name}\"\n      - path: ingress.enabled           # chart default is false\n        value: true\n      - path: ingress.className\n        value: 'nginx'\n      - path: ingress.annotations\n        from: annotations\n      - path: ingress.hosts[0].host\n        from: url\n      - path: ingress.hosts[0].paths[0].path\n        value: '/'\n      - path: ingress.hosts[0].paths[0].pathType\n        value: 'Prefix'\n      - path: ingress.tls[0].hosts[0]\n        from: url\n      - path: ingress.tls[0].secretName\n        template: \"{name}-submodel-tls\"\n      # Liveness/readiness probes — the local chart gates them on `.enabled`.\n      # The image's /actuator/health/* paths 404, so keep them off here.\n      - path: livenessProbe.enabled\n        value: false\n      - path: readinessProbe.enabled\n        value: false\n\n  # Digital Twin Registry — its own chart + release. Deployed when present in the\n  # request's `components` array. `url` is its ingress host; `auth.*` its DB creds.\n  digitalTwinRegistry:\n    releaseName: \"{name}\"             # the component's own name\n    version: \"{version}\"             # the component's own version\n    healthPath: \"/semantics/registry/\"   # reachability probe path appended to the ingress url\n    chart:\n      name: digital-twin-registry\n      repo: tractusx-dev\n    # Base values per version come from the mounted registry-templates\n    # ConfigMaps (backend.registry.templates), like connector-templates.\n    templatesDir: config/registry-templates\n    # Last 2 stable releases (latest first). Source: tractusx charts/dev index.\n    versions:\n      - version: \"0.12.0\"\n        valuesYaml: /values-0.12.0.yaml\n      - version: \"0.11.0\"\n        valuesYaml: /values-0.11.0.yaml\n    derive:\n      # digital-twin-registry issues TLS via the cert-manager annotation (no\n      # certManager field). external-dns points at this component's own host.\n      annotations:\n        external-dns.alpha.kubernetes.io/hostname: \"{url}\"\n        #cert-manager.io/cluster-issuer: \"letsencrypt-int\"\n        nginx.ingress.kubernetes.io/rewrite-target: /$2\n        nginx.ingress.kubernetes.io/use-regex: \"true\"\n        nginx.ingress.kubernetes.io/cors-allow-credentials: \"true\"\n        nginx.ingress.kubernetes.io/x-forwarded-prefix: /semantics/registry\n    valueMappings:\n      - path: fullnameOverride          # top-level (the chart has no registry.fullnameOverride)\n        template: \"{name}\"\n      - path: enableKeycloak\n        value: false\n      # The chart ALWAYS renders templates/keycloak/init-script-configmap.yaml as\n      # \"{keycloak.fullnameOverride}-configmap\" (not gated on enableKeycloak). The\n      # chart default fullnameOverride is the fixed \"registry-keycloak\", so two DTR\n      # releases in one namespace collide on \"registry-keycloak-configmap\". Make it\n      # release-unique so each DTR owns its own configmap.\n      - path: keycloak.fullnameOverride\n        template: \"{name}-keycloak\"\n      # Bundled postgres (like the connector). With enablePostgres=true the chart\n      # deploys its own DB and wires the registry to it via postgres-init, so the\n      # registry-secret's external `dataSource` block is skipped entirely.\n      - path: enablePostgres\n        value: true\n      - path: postgresql.auth.username\n        from: auth.db_username          # from the component's auth block\n      - path: postgresql.auth.password\n        from: auth.db_password          # empty -> chart generates a random one\n      - path: postgresql.auth.database\n        from: db_name\n      # The init secret name (chart default \"secret-dtr-postgres-init\") is shared\n      # by the postgres-init hook, the registry deployment and the postgres\n      # subchart. It's a fixed literal, so two DTR releases collide on it — make\n      # it release-unique (all three consumers read this same value).\n      - path: postgresql.auth.existingSecret\n        template: \"{name}-postgres-init\"\n      - path: registry.host             # the externally-resolvable ingress host\n        from: url\n      - path: registry.ingress.enabled\n        value: true\n      - path: registry.ingress.urlPrefix\n        value: '/semantics/registry'\n      - path: registry.ingress.className\n        value: 'nginx'\n      - path: registry.ingress.annotations\n        from: annotations\n      - path: registry.ingress.tls.enabled        # tls is a MAP here, not a list\n        value: true\n      - path: registry.ingress.tls.secretName\n        template: \"{name}-dtr-tls\"\n\n  # IdentityHub — its own chart + release, deployed for every connector\n  # (it is the connector's own DID/credential service, not an optional add-on).\n  # identityhub:\n  #   deployWhen: always\n  #   releaseName: \"{name}-idhub\"\n  #   chart:\n  #     name: tractusx-identityhub\n  #     repo: tractusx-dev\n  #   # Last 3 stable releases (latest first; note the chart tags carry a 'v').\n  #   # Source: tractusx charts/dev index.\n  #   versions:\n  #     - version: \"v0.3.2\"\n  #     - version: \"v0.3.1\"\n  #     - version: \"v0.3.0\"\n  #   valueMappings:\n  #     - path: fullnameOverride\n  #       template: \"{name}-idhub\"\n  #     - path: ingress.hosts[0].host\n  #       template: \"{name}.int.construct-x.net\"\n  #     - path: ingress.tls[0].hosts[0]\n  #       template: \"{name}.int.construct-x.net\"\n  #     - path: ingress.tls[0].secretName\n  #       template: \"{name}-idhub-tls\"\n\ndatabase:\n  url: \"${DATABASE_URL}\"\n  echo: false"
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
  podSecurityContext: {}
  securityContext: {}
  envFrom: []
  env:
    - name: CLUSTER_SECRET
      value: "cluster-int"
    - name: VAULT_ADDR
      value: "https://vault.staging.arena2036-x.de"
    - name: VAULT_TOKEN
      valueFrom:
        secretKeyRef:
          name: vault-token
          key: token
  ## Additional volumes on the output Deployment definition.
  volumes:
    # -- persist the backend configuration
    - name: emc-backend-config
      configMap:
        name: "{{ .Release.Name }}-backend-config"
    # -- per-version upstream tractusx-connector default values.yaml (render templates)
    - name: connector-tpl-0-12-1
      configMap:
        name: "{{ .Release.Name }}-tractusx-connector-values-0-12-1"
    - name: connector-tpl-0-11-2
      configMap:
        name: "{{ .Release.Name }}-tractusx-connector-values-0-11-2"
    - name: connector-tpl-0-10-3
      configMap:
        name: "{{ .Release.Name }}-tractusx-connector-values-0-10-3"
    - name: dtr-tpl-0-11-0
      configMap:
        name: "{{ .Release.Name }}-dtr-values-0-11-0"
    - name: dtr-tpl-0-12-0
      configMap:
        name: "{{ .Release.Name }}-dtr-values-0-12-0"
    # -- persist the backend data directories
    - name: pvc-emc-backend
      persistentVolumeClaim:
        claimName: "{{ .Release.Name }}-pvc-emc-backend-data"
    # -- temporary file system mount
    - name: tmpfs-1
      emptyDir: {}
  ## Volume mounts for the backend deployment.
  volumeMounts:
    # -- mounted path for the backend configuration added in the config maps
    - name: emc-backend-config
      mountPath: /backend/config/configuration.yml
      subPath: configuration.yml
    # -- mounted per-version upstream connector value templates.
    # subPath is the ConfigMap data KEY (always "values.yaml"); the version is
    # carried by mountPath. Using "values-<version>.yaml" here would not match any
    # key, so kubelet mounts an empty dir -> "not a directory" container init error.
    - name: connector-tpl-0-12-1
      mountPath: /backend/config/connector-templates/values-0.12.1.yaml
      subPath: values.yaml
    - name: connector-tpl-0-11-2
      mountPath: /backend/config/connector-templates/values-0.11.2.yaml
      subPath: values.yaml
    - name: connector-tpl-0-10-3
      mountPath: /backend/config/connector-templates/values-0.10.3.yaml
      subPath: values.yaml
    - name: dtr-tpl-0-11-0
      mountPath: /backend/config/registry-templates/values-0.11.0.yaml
      subPath: values.yaml
    - name: dtr-tpl-0-12-0
      mountPath: /backend/config/registry-templates/values-0.12.0.yaml
      subPath: values.yaml
    # -- contains the location for the process data directory
    - name: pvc-emc-backend
      mountPath: /backend/data
      subPath: data
    # -- contains the log directory used by the backend
    - name: tmpfs-1
      mountPath: /backend/logs
      subPath: logs
frontend:
  enabled: true
  name: "emc-frontend"
  replicaCount: 1
  image:
    repository: "harbor-hub-shared.arena.3ascloud.de/arena2036/emc-frontend"
    pullPolicy: Always
    tag: "8505ebe061e96a4c07c5b2dde073f76bd7f2f0a0"
  imagePullSecrets:
    - name: registry-creds
  env:
    - name: VITE_BACKEND_URL
      value: https://emc-backend.txcd.arena2036.app
    - name: VITE_API_KEY
      value: emc-api-key
    - name: VITE_EDC_HOSTNAME
      value: txcd.arena2036.app
    - name: VITE_KEYCLOAK_URL
      value: https://centralidp.txcd.arena2036-x.de/auth/
    - name: VITE_KEYCLOAK_REALM
      value: "CX-Central"
    - name: VITE_KEYCLOAK_CLIENT_ID
      value: EMC
    - name: VITE_SDE_URL
      value: https://sde.txcd.arena2036.app
    - name: VITE_PORTAL_URL
      value: https://portal.txcd.arena2036-x.de
  configuration: |-
    window.__RUNTIME_CONFIG__ = {
    apiUrl: https://emc-backend.txcd.arena2036.app,
    apiKey: emc-api-key,
    edcHost: arena2036-x.de,
    keycloakUrl: https://centralidp.txcd.arena2036-x.de/auth,
    realm: CX-Central,
    clientId: EMC-1,
    sdeUrl: https://sde.txcd.arena2036.app,
    portalUrl: https://portal.txcd.arena2036-x.de
    };
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    ingressClassName: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-int
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/ssl-passthrough: "false"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
      nginx.ingress.kubernetes.io/service-upstream: "true"
    hosts:
      - host: &fehostname "emc.txcd.arena2036.app"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: emc-frontend-tls
        hosts:
          - *fehostname
  resources: {}
  volumes:
    - name: emc-frontend-config
      configMap:
        name: "{{ .Release.Name }}-frontend-config"
  volumeMounts:
    - name: emc-frontend-config
      mountPath: /frontend/.env
      subPath: .env
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "emc"
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
livenessProbe:
  httpGet:
    path: /health
    port: 8001
readinessProbe:
  httpGet:
    path: /health
    port: 8001
nodeSelector: {}
tolerations: []
affinity: {}
# Observability stack (Grafana/Prometheus/Loki)
grafana:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-int
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - grafana.txcd.arena2036-x.de
    path: /
    pathType: Prefix
    tls:
      - secretName: emc-grafana-txcd-tls
        hosts:
          - grafana.txcd.arena2036-x.de
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: edc-management-console
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://emc-prometheus-server
          isDefault: true
          editable: false
        - name: Loki
          uid: loki
          type: loki
          access: proxy
          url: http://emc-loki-gateway
          editable: false
# Prometheus
prometheus:
  enabled: true
  # Not required for a small staging environment.
  alertmanager:
    enabled: false
  # Keep this enabled because your dashboard uses kube_* metrics.
  kube-state-metrics:
    enabled: true
  # Creates one pod on every Kubernetes node when enabled.
  prometheus-node-exporter:
    enabled: false
  # Not required unless applications explicitly push metrics.
  prometheus-pushgateway:
    enabled: false
  server:
    persistentVolume:
      enabled: true
      size: 10Gi
# Loki
loki:
  enabled: true
  deploymentMode: SingleBinary
  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
      path_prefix: /var/loki
    storage:
      type: filesystem
      bucketNames:
        chunks: chunks
        ruler: ruler
        admin: admin
    useTestSchema: true
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 168h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""
  read:
    replicas: 0
  write:
    replicas: 0
  backend:
    replicas: 0
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  gateway:
    enabled: true
  lokiCanary:
    enabled: false
  # Required when lokiCanary is disabled.
  test:
    enabled: false
# Disabled components
opentelemetry-collector:
  enabled: false
jaeger:
  enabled: false
