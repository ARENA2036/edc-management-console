---
{{- if and .Values.grafana.enabled (not .Values.grafana.ingress.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Release.Namespace }}
  {{- with .Values.grafana.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  ingressClassName: {{ .Values.grafana.ingress.ingressClassName | default "nginx" | quote }}

  rules:
    - host: {{ required "grafana.ingress.hosts[0] must be configured" (first .Values.grafana.ingress.hosts) | quote }}
      http:
        paths:
          - path: {{ .Values.grafana.ingress.path | default "/" | quote }}
            pathType: {{ .Values.grafana.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .Release.Name }}-grafana
                port:
                  number: 80

  {{- with .Values.grafana.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}