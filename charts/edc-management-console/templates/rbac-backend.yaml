---
# ClusterManager (backend/app/managers/cluster_manager.py) lists Deployments,
# StatefulSets, Pods and Services to compute each deployed component's status.
# Without this, the calls come back 403 in any RBAC-enabled cluster and every
# component is reported as "unknown".
#
# Scoped to the release namespace: this assumes deployed components (connectors,
# digital twin registries, submodel servers) live in the same namespace as EMC
# itself, i.e. dataspaceConfig.clusterConfig.namespace == the Helm release
# namespace. If components are deployed into a different namespace, this Role
# needs to target that namespace (or become a ClusterRole) instead.
#
# Bound to the shared service account (see serviceaccount.yaml): the frontend
# pod also runs under this identity today and would gain these read
# permissions too. Give the backend its own ServiceAccount if that is not
# acceptable.
{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "chart.fullname" . }}-backend-status
  labels:
    {{- include "chart.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "chart.fullname" . }}-backend-status
  labels:
    {{- include "chart.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "chart.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "chart.fullname" . }}-backend-status
  apiGroup: rbac.authorization.k8s.io
{{- end }}
