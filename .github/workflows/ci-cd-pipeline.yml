name: EMC CI-CD Pipeline

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - ci-cd-branch
      - develop
      - 'release/**'

  pull_request:
    branches:
      - develop
      - 'release/**'

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

      image_tag:
        description: "Optional tag for both backend and frontend. Empty = current Git SHA"
        required: false
        type: string

      backend_image_repository:
        description: "Optional backend image repository override"
        required: false
        type: string

      frontend_image_repository:
        description: "Optional frontend image repository override"
        required: false
        type: string

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read
  issues: write
  id-token: write

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  helm-lint:
    name: Helm Lint
    uses: ./.github/workflows/helm-lint.yml
    secrets: inherit

  kics:
    name: KICS Scan
    uses: ./.github/workflows/kics.yaml
    secrets: inherit

  trufflehog:
    name: Secret Scan
    uses: ./.github/workflows/trufflehog.yml
    secrets: inherit

  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    secrets: inherit

  backend-dependencies:
    name: Backend Dependency Scan
    uses: ./.github/workflows/dependencies-backend.yml
    secrets: inherit

  frontend-dependencies:
    name: Frontend Dependency Scan
    uses: ./.github/workflows/dependencies-frontend.yaml
    secrets: inherit

  build:
    name: Build Images
    needs:
      - verify
      - helm-lint
      - kics
      - trufflehog
      - codeql
      - backend-dependencies
      - frontend-dependencies
    uses: ./.github/workflows/emc-build.yaml
    secrets: inherit

  trivy:
    name: Trivy Image Scan
    needs: build
    uses: ./.github/workflows/reusable-trivy.yml
    secrets: inherit

  # ------------------------------------------------------------
  # Automatic isolated preview environments
  # ------------------------------------------------------------
  deploy-preview:
    name: Deploy Isolated Developer Preview
    needs: trivy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      (
        startsWith(github.ref_name, 'feature/') ||
        startsWith(github.ref_name, 'bugfix/') ||
        startsWith(github.ref_name, 'hotfix/')
      )

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -LO -s \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          curl -sSL \
            https://releases.hashicorp.com/vault/1.21.2/vault_1.21.2_linux_amd64.zip \
            -o vault.zip
          unzip -q vault.zip
          chmod +x vault
          sudo mv vault /usr/local/bin/

      - name: Connect to Dev cluster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"

          export VAULT_ADDR="${{ secrets.VAULT_ADDR_DEV }}"
          export VAULT_TOKEN="${{ secrets.VAULT_TOKEN_DEV }}"

          vault kv get \
            -field=config \
            "dev/infra/cluster-dev" \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"

          CONTEXT="$(yq e '.current-context' "$HOME/.kube/config")"
          test -n "$CONTEXT"
          test "$CONTEXT" != "null"

          kubectl --context="$CONTEXT" cluster-info
          echo "KUBE_CONTEXT=$CONTEXT" >> "$GITHUB_ENV"

      - name: Generate preview identifiers
        shell: bash
        run: |
          set -euo pipefail

          BRANCH_SLUG="$(printf '%s' "${{ github.ref_name }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's#[^a-z0-9-]#-#g' \
            | sed 's/--*/-/g' \
            | sed 's/^-//' \
            | sed 's/-$//' \
            | cut -c1-35)"

          BRANCH_HASH="$(printf '%s' "${{ github.ref_name }}" | sha256sum | cut -c1-7)"
          SAFE_BRANCH="${BRANCH_SLUG}-${BRANCH_HASH}"

          {
            echo "PREVIEW_NAME=emc-${SAFE_BRANCH}"
            echo "PREVIEW_NAMESPACE=emc-${SAFE_BRANCH}"
            echo "FRONTEND_HOST=${SAFE_BRANCH}.dev.arena2036-x.de"
            echo "BACKEND_HOST=${SAFE_BRANCH}-backend.dev.arena2036-x.de"
          } >> "$GITHUB_ENV"

      - name: Generate preview Argo CD Application
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE=".github/argocd/emc-dev-preview-app.yaml"
          GENERATED="/tmp/emc-dev-preview-app.yaml"

          cp "$TEMPLATE" "$GENERATED"

          sed -i "s|REPLACE_PREVIEW_NAME|${PREVIEW_NAME}|g" "$GENERATED"
          sed -i "s|REPLACE_PREVIEW_NAMESPACE|${PREVIEW_NAMESPACE}|g" "$GENERATED"
          sed -i "s|REPLACE_BRANCH_NAME|${{ github.ref_name }}|g" "$GENERATED"
          sed -i "s|REPLACE_IMAGE_TAG|${{ github.sha }}|g" "$GENERATED"
          sed -i "s|REPLACE_FRONTEND_HOST|${FRONTEND_HOST}|g" "$GENERATED"
          sed -i "s|REPLACE_BACKEND_HOST|${BACKEND_HOST}|g" "$GENERATED"

          if grep -q 'REPLACE_' "$GENERATED"; then
            echo "Unresolved placeholders found"
            grep 'REPLACE_' "$GENERATED"
            exit 1
          fi

          kubectl apply --dry-run=client -f "$GENERATED" >/dev/null

      - name: Apply preview Application
        shell: bash
        run: |
          set -euo pipefail
          kubectl --context="$KUBE_CONTEXT" \
            apply -f /tmp/emc-dev-preview-app.yaml

          kubectl --context="$KUBE_CONTEXT" \
            get application "$PREVIEW_NAME" -n argocd

          echo "Frontend: https://${FRONTEND_HOST}"
          echo "Backend: https://${BACKEND_HOST}"

  # ------------------------------------------------------------
  # Manual shared development deployment from develop only
  # ------------------------------------------------------------
  deploy-shared-dev:
    name: Deploy Dev
    needs: trivy
    runs-on: ubuntu-latest
    # for testing then remove it after testing
    if: |
      (
        github.event_name == 'push' &&
        github.ref_name == 'ci-cd-branch'
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.environment == 'dev' &&
        github.ref_name == 'develop'
      )
# After testing is finished, change the condition back to manual-only:
    # if: |
    #   github.event_name == 'workflow_dispatch' &&
    #   github.event.inputs.environment == 'dev' &&
    #   github.ref_name == 'develop'
      
    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -LO -s \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          curl -sSL \
            https://releases.hashicorp.com/vault/1.21.2/vault_1.21.2_linux_amd64.zip \
            -o vault.zip
          unzip -q vault.zip
          chmod +x vault
          sudo mv vault /usr/local/bin/

      - name: Resolve requested images
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [[ -z "$IMAGE_TAG" ]]; then
            IMAGE_TAG="${{ github.sha }}"
          fi

          echo "DEPLOY_IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Update values-dev.yaml
        shell: bash
        run: |
          set -euo pipefail

          VALUES_FILE="charts/edc-management-console/values-dev.yaml"

          yq -i '.backend.image.tag = strenv(DEPLOY_IMAGE_TAG)' "$VALUES_FILE"
          yq -i '.frontend.image.tag = strenv(DEPLOY_IMAGE_TAG)' "$VALUES_FILE"

          if [[ -n "${{ github.event.inputs.backend_image_repository }}" ]]; then
            BACKEND_REPOSITORY="${{ github.event.inputs.backend_image_repository }}" \
              yq -i '.backend.image.repository = strenv(BACKEND_REPOSITORY)' "$VALUES_FILE"
          fi

          if [[ -n "${{ github.event.inputs.frontend_image_repository }}" ]]; then
            FRONTEND_REPOSITORY="${{ github.event.inputs.frontend_image_repository }}" \
              yq -i '.frontend.image.repository = strenv(FRONTEND_REPOSITORY)' "$VALUES_FILE"
          fi

          cat "$VALUES_FILE"

      - name: Commit shared Dev values
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f charts/edc-management-console/values-dev.yaml
          git commit \
            -m "chore(dev): deploy image ${DEPLOY_IMAGE_TAG} [skip ci]" \
            || echo "No Dev values change"

          git push origin HEAD:develop

      - name: Connect to Dev cluster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"

          export VAULT_ADDR="${{ secrets.VAULT_ADDR_DEV }}"
          export VAULT_TOKEN="${{ secrets.VAULT_TOKEN_DEV }}"

          vault kv get \
            -field=config \
            "dev/infra/cluster-dev" \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"
          CONTEXT="$(yq e '.current-context' "$HOME/.kube/config")"

          kubectl --context="$CONTEXT" cluster-info
          echo "KUBE_CONTEXT=$CONTEXT" >> "$GITHUB_ENV"

      - name: Apply shared Dev Application
        shell: bash
        run: |
          set -euo pipefail

          kubectl --context="$KUBE_CONTEXT" \
            apply -f .github/argocd/emc-dev-app.yaml

          kubectl --context="$KUBE_CONTEXT" \
            get application emc-dev -n argocd

  # ------------------------------------------------------------
  # Manual Production deployment from release/** only
  # ------------------------------------------------------------
  deploy-production:
    name: Deploy Production
    needs: trivy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'prod' &&
      startsWith(github.ref_name, 'release/')

    permissions:
      contents: write

    steps:
      - name: Checkout selected release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          KUBECTL_VERSION="$(curl -L -s https://dl.k8s.io/release/stable.txt)"
          curl -LO -s \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          curl -sSL \
            https://releases.hashicorp.com/vault/1.21.2/vault_1.21.2_linux_amd64.zip \
            -o vault.zip
          unzip -q vault.zip
          chmod +x vault
          sudo mv vault /usr/local/bin/

      - name: Resolve requested images
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          if [[ -z "$IMAGE_TAG" ]]; then
            IMAGE_TAG="${{ github.sha }}"
          fi

          echo "DEPLOY_IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Update values-prod.yaml
        shell: bash
        run: |
          set -euo pipefail

          VALUES_FILE="charts/edc-management-console/values-prod.yaml"

          yq -i '.backend.image.tag = strenv(DEPLOY_IMAGE_TAG)' "$VALUES_FILE"
          yq -i '.frontend.image.tag = strenv(DEPLOY_IMAGE_TAG)' "$VALUES_FILE"

          if [[ -n "${{ github.event.inputs.backend_image_repository }}" ]]; then
            BACKEND_REPOSITORY="${{ github.event.inputs.backend_image_repository }}" \
              yq -i '.backend.image.repository = strenv(BACKEND_REPOSITORY)' "$VALUES_FILE"
          fi

          if [[ -n "${{ github.event.inputs.frontend_image_repository }}" ]]; then
            FRONTEND_REPOSITORY="${{ github.event.inputs.frontend_image_repository }}" \
              yq -i '.frontend.image.repository = strenv(FRONTEND_REPOSITORY)' "$VALUES_FILE"
          fi

          cat "$VALUES_FILE"

      - name: Commit Production values
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -f charts/edc-management-console/values-prod.yaml
          git commit \
            -m "chore(prod): deploy image ${DEPLOY_IMAGE_TAG} [skip ci]" \
            || echo "No Production values change"

          git push origin "HEAD:${{ github.ref_name }}"

      - name: Prepare Production Argo CD Application
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE=".github/argocd/emc-prod-app.yaml"
          GENERATED="/tmp/emc-prod-app.yaml"

          cp "$TEMPLATE" "$GENERATED"
          sed -i \
            "s|REPLACE_RELEASE_BRANCH|${{ github.ref_name }}|g" \
            "$GENERATED"

          if grep -q 'REPLACE_' "$GENERATED"; then
            echo "Unresolved placeholders found"
            grep 'REPLACE_' "$GENERATED"
            exit 1
          fi

      - name: Connect to Production cluster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"

          export VAULT_ADDR="${{ secrets.VAULT_ADDR_PROD }}"
          export VAULT_TOKEN="${{ secrets.VAULT_TOKEN_PROD }}"

          vault kv get \
            -field=config \
            "prod/infra/cluster-prod" \
            > "$HOME/.kube/config"

          chmod 600 "$HOME/.kube/config"
          CONTEXT="$(yq e '.current-context' "$HOME/.kube/config")"

          kubectl --context="$CONTEXT" cluster-info
          echo "KUBE_CONTEXT=$CONTEXT" >> "$GITHUB_ENV"

      - name: Apply Production Application
        shell: bash
        run: |
          set -euo pipefail

          kubectl --context="$KUBE_CONTEXT" \
            apply -f /tmp/emc-prod-app.yaml

          kubectl --context="$KUBE_CONTEXT" \
            get application emc-prod -n argocd

  chart-release:
    name: Chart Release
    needs: deploy-production
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'release/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod')
    uses: ./.github/workflows/chart-release.yaml
    secrets: inherit
          
  # chart-release:
  #   name: Chart Release
  #   needs: deploy-emc-staging
  #   if: github.event_name == 'push' && github.ref_name == 'ci-cd-branch'
  #   uses: ./.github/workflows/chart-release.yaml
  #   secrets: inherit