---
name: "Check Backend Dependencies"

on:
  push:
    branches: [main, develop]    
    paths:
      - backend/requirements.txt
      - DEPENDENCIES_EMC-BACKEND
      - .github/workflows/dependencies-backend.yml
  pull_request:
    branches: [main, develop]
    paths:
      - backend/requirements.txt
      - DEPENDENCIES_EMC-BACKEND
      - .github/workflows/dependencies-backend.yml
  workflow_call:
  workflow_dispatch:

jobs:
  check-dependencies-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        folder: [backend]

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
    
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
            python-version: '3.12'

      - name: Create and activate virtual environment
        run: |
          python -m venv ${{ matrix.folder }}/venv
          source ${{ matrix.folder }}/venv/bin/activate
          echo "VIRTUAL_ENV=${{ matrix.folder }}/venv" >> $GITHUB_ENV
          echo "PATH=${{ matrix.folder }}/venv/bin:$PATH" >> $GITHUB_ENV

      - name: Install dependencies in isolated environment
        run: |
          source ${{ matrix.folder }}/venv/bin/activate
          if [ -f ${{ matrix.folder }}/requirements.txt ]; then
            pip install -r ${{ matrix.folder }}/requirements.txt
          else
            echo "No requirements.txt found in ${{ matrix.folder }}, skipping..."
          fi

      - name: List packages
        run: |
            source ${{ matrix.folder }}/venv/bin/activate
            # pip itself is the installer, not a project dependency, and this step
            # upgrades it right before installing - so its version (and therefore
            # this line) changes on its own release schedule, independent of any
            # requirements.txt change, causing a spurious diff against the
            # committed DEPENDENCIES_EMC-BACKEND on every pip release.
            pip list --format=freeze | grep -v '^pip==' | awk -F'==' '{print "pypi/pypi/-/" $1 "/" $2}' | awk '!seen[$0]++' > ${{ matrix.folder }}/PACKAGE

      - name: Generate Dependencies file
        run: |
            curl -L --output ./org.eclipse.dash.licenses-1.1.1.jar 'https://repo.eclipse.org/service/rest/v1/search/assets/download?repository=dash-maven2-releases&maven.groupId=org.eclipse.dash&maven.artifactId=org.eclipse.dash.licenses&maven.baseVersion=1.1.0&maven.extension=jar'
            
            if [[ "${{ matrix.folder }}" == "backend" ]]; then
                DEP_FILE="DEPENDENCIES_EMC-BACKEND"
            fi

            echo "DEP_FILE=$DEP_FILE" >> $GITHUB_ENV

            java -jar ./org.eclipse.dash.licenses-1.1.1.jar ${{ matrix.folder }}/PACKAGE -project automotive.tractusx -summary $DEP_FILE || true

      - name: Check if dependencies were changed
        id: dependencies-changed
        run: |
            if git diff --exit-code $DEP_FILE; then
                echo "changed=false" >> $GITHUB_OUTPUT
            else
                echo "changed=true" >> $GITHUB_OUTPUT
                echo "Change the $DEP_FILE with this new dependencies"
                cat $DEP_FILE
                exit 1
            fi

      - name: Check for restricted dependencies
        run: |
            restricted=$(grep 'restricted' $DEP_FILE || true)
            if [[ -n "$restricted" ]]; then
                echo "The following dependencies are restricted: $restricted"
                exit 1
            fi

      - name: Upload $DEP_FILE file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependencies-backend
          path: ${{ env.DEP_FILE }}