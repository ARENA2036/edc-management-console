name: "Trivy (Reusable)"

on:
  push:
    branches: [main, develop]
  # schedule:
    # Once a day
    # - cron: "0 0 * * 0"
  workflow_call:
    inputs:
      image_tag:
        description: "Docker image tag to scan"
        required: false
        type: string
        default: ""

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional Docker image tag to scan"
        required: false
        default: ""
        type: string

env:
  IMAGE_NAMESPACE: harbor-hub-shared.arena.3ascloud.de/arena2036
  # BACKEND_IMAGE_NAME: emc-backend
  # FRONTEND_IMAGE_NAME: emc-frontend

permissions:
  contents: read

jobs:
  trivy-config:
    name: Trivy Config Scan

    permissions:
      actions: read
      contents: read
      security-events: write
    uses: eclipse-tractusx/sig-infra/.github/workflows/reusable-trivy.yaml@main
    with:
      scan-type: "config"
      output-file: "trivy-config.sarif"
      severity: "CRITICAL,HIGH"

  trivy-images:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - emc-backend
          - emc-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
    
      - name: Determine image tag
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${{ inputs.image_tag }}" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          else
            IMAGE_TAG="${{ github.sha }}"
          fi

          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Scanning image tag: $IMAGE_TAG"

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HBR_REGISTRY }}
          username: ${{ secrets.HBR_USERNAME }}
          password: ${{ secrets.HBR_PASSWORD }}

      - name: Run Trivy vulnerability scanner (docker image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-results-${{ matrix.image }}.sarif"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
          hide-progress: false
          exit-code: "0"
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: "trivy-results-${{ matrix.image }}.sarif"