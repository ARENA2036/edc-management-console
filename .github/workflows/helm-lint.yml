---
name:  EDC Management Console Lint and Test Charts

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "charts/**"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/**"

  workflow_call:
    inputs:
      node_image:
        description: kindest/node image for the Kubernetes KinD cluster
        default: kindest/node:v1.30.0
        required: false
        type: string
      helm_version:
        description: Helm version to test
        default: v3.12.1
        required: false
        type: string

  workflow_dispatch:
    inputs:
      node_image:
        description: kindest/node image for the Kubernetes KinD cluster
        default: kindest/node:v1.30.0
        required: false
        type: string
      helm_version:
        description: Helm version to test
        default: v3.12.1
        required: false
        type: string

permissions:
  contents: read

env:
  CHART_PATH: charts/edc-management-console
  BACKEND_IMAGE: emc-backend:testing
  FRONTEND_IMAGE: emc-frontend:testing

jobs:
  lint-test:
    name: Lint and install Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@b7246b12e77f7134dc2d460a3d5bad15bbe29390 # v4.1.0
        with:
          version: ${{ inputs.helm_version || 'v3.12.1' }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2.7.0

      - name: Display tool versions
        run: |
          set -euo pipefail
          helm version
          ct version
          python --version

      - name: Set target branch
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target_branch="${{ github.event.pull_request.base.ref }}"
          else
            target_branch="${{ github.event.repository.default_branch }}"
          fi

          if [[ -z "${target_branch}" ]]; then
            target_branch="main"
          fi

          echo "branch=${target_branch}" >> "${GITHUB_OUTPUT}"
          echo "Using target branch: ${target_branch}"

      - name: Update Helm dependencies
        run: |
          set -euo pipefail
          helm dependency update "${CHART_PATH}"

      # These two steps expose the actual Helm template error.
      - name: Run Helm lint with debug output
        run: |
          set -euo pipefail
          helm lint "${CHART_PATH}" \
            --with-subcharts \
            --debug

      - name: Render Helm templates with debug output
        run: |
          set -euo pipefail
          helm template edc-management-console "${CHART_PATH}" \
            --namespace edc-management-console \
            --debug \
            > /tmp/edc-management-console-rendered.yaml

          test -s /tmp/edc-management-console-rendered.yaml
          echo "Rendered manifests successfully."

      - name: List changed charts
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          changed_charts="$(
            ct list-changed \
              --target-branch "${{ steps.target.outputs.branch }}"
          )"

          if [[ -n "${changed_charts}" ]]; then
            echo "has_changes=true" >> "${GITHUB_OUTPUT}"
            {
              echo "charts<<EOF"
              echo "${changed_charts}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"

            echo "Changed charts:"
            echo "${changed_charts}"
          else
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No changed charts detected."
          fi

      - name: Run chart-testing lint
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          set -euo pipefail

          ct lint \
            --validate-maintainers=false \
            --target-branch "${{ steps.target.outputs.branch }}" \
            --debug

      - name: Create Kubernetes KinD cluster
        if: steps.changed.outputs.has_changes == 'true'
        uses: container-tools/kind-action@0ad70e2299366b0e1552c7240f4e4567148f723e # v2.0.4
        with:
          version: v0.20.0
          node_image: ${{ inputs.node_image || 'kindest/node:v1.30.0' }}

      - name: Build EMC backend image
        if: steps.changed.outputs.has_changes == 'true'
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: backend
          push: false
          load: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Build EMC frontend image
        if: steps.changed.outputs.has_changes == 'true'
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: frontend
          push: false
          load: true
          tags: ${{ env.FRONTEND_IMAGE }}

      - name: Load backend image into KinD
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          kind load docker-image "${BACKEND_IMAGE}"

      - name: Load frontend image into KinD
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          set -euo pipefail
          kind load docker-image "${FRONTEND_IMAGE}"

      - name: Run chart-testing install
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          set -euo pipefail

          ct install \
            --charts "${CHART_PATH}" \
            --debug \
            --helm-extra-set-args \
              "--set backend.image.registry= \
              --set backend.image.repository=emc-backend \
              --set backend.image.tag=testing \
              --set backend.image.pullPolicy=Never \
              --set frontend.image.registry= \
              --set frontend.image.repository=emc-frontend \
              --set frontend.image.tag=testing \
              --set frontend.image.pullPolicy=Never \
              --set-json backend.imagePullSecrets=[] \
              --set-json frontend.imagePullSecrets=[]"
