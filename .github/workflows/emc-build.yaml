name: emc-build

on:
  push:
    branches: 
      - develop
      - main
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'release/**'
      - ci-cd-branch

  workflow_call:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Optional Docker image tag'
        required: false
        default: ""
        type: string
        
env:
  IMAGE_NAMESPACE: 'harbor-hub-shared.arena.3ascloud.de/arena2036'
  BACKEND_IMAGE_NAME: 'emc-backend'
  FRONTEND_IMAGE_NAME: 'emc-frontend'
  SERVER_URL: '${{ github.server_url }}'
  REPOSITORY: '${{ github.repository }}'
  REF_NAME: '${{ github.ref_name }}'

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Docker Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.HBR_REGISTRY }}
          username: ${{ secrets.HBR_USERNAME }}
          password: ${{ secrets.HBR_PASSWORD }}

      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' }}

      
      - name: Build and push Docker image
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-frontend:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Docker Login
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.HBR_REGISTRY }}
          username: ${{ secrets.HBR_USERNAME }}
          password: ${{ secrets.HBR_PASSWORD }}
      
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=${{ github.event.inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.image_tag != '' }}

      
      - name: Build and push Docker image
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.17.0
        with:
          context: frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}