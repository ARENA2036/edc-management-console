apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: emc-application
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ARENA2036/edc-management-console.git
    targetRevision: ci-cd-branch
    path: charts/edc-management-console
    helm:
      valueFiles:
        - values-staging.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: edc-management-console

  syncPolicy:
    # automated:
    #   prune: true
    #   selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true