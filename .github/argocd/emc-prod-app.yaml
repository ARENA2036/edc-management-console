apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: emc-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/ARENA2036/edc-management-console.git
    targetRevision: release
    path: charts/edc-management-console
    helm:
      releaseName: emc
      valueFiles:
        - values-prod.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: emc-prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Replace=true