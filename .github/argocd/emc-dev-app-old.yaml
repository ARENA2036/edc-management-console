apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: emc-dev
  namespace: argocd

spec:
  project: edc-management-console

  source:
    repoURL: https://github.com/ARENA2036/edc-management-console.git
    targetRevision: HEAD
    path: charts/edc-management-console
    helm:
      releaseName: emc
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: emc-dev

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Replace=true

