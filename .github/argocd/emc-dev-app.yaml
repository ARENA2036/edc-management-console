apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: emc-application-ap6
  namespace: argocd

  labels:
    app.kubernetes.io/name: emc
    app.kubernetes.io/component: shared-development
    app.kubernetes.io/managed-by: github-actions

  annotations:
    environment.emc/type: shared-development

spec:
  project: edc-management-console

  source:
    repoURL: https://github.com/ARENA2036/edc-management-console.git
    targetRevision: develop
    path: charts/edc-management-console

    helm:
      releaseName: emc

      valueFiles:
        - values-dev.yaml

      parameters:
        # Backend Docker image tag.
        # CI/CD replaces REPLACE_IMAGE_TAG with:
        # 1. Manual image_tag, when provided.
        # 2. Current Git SHA, when image_tag is empty.
        - name: backend.image.tag
          value: REPLACE_BACKEND_IMAGE_TAG
          forceString: true

        # Frontend Docker image tag.
        # Uses the same resolved tag as the backend.
        - name: frontend.image.tag
          value: REPLACE_FRONTEND_IMAGE_TAG
          forceString: true

  destination:
    name: arenax-ap6
    namespace: edc-management-console

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      # Create the namespace automatically if it does not exist.
      - CreateNamespace=true
      # Replace resources when required during synchronization.
      - Replace=true
      # Perform pruning after the new resources are synchronized.
      - PruneLast=true

  revisionHistoryLimit: 3